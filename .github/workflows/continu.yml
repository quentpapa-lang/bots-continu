# Bots en continu : une tâche de ~5 h 40 qui tourne minute par minute ; le déclencheur (toutes les 30 min) met
# toujours une tâche en attente, qui démarre dès que la précédente se termine. Une seule tourne à la fois.
name: continu

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: continu
  cancel-in-progress: false

permissions:
  contents: read
  actions: write          # pour mettre la tâche suivante en attente (relais)

jobs:
  boucle:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      # Relais : la tâche suivante est mise en attente dès maintenant ; elle démarre quand celle-ci se termine (groupe de
      # concurrence). Le déclencheur toutes les 30 min de GitHub n'est qu'un filet : il ne s'est pas déclenché le 02/11.
      - name: relais (tâche suivante en attente)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run continu.yml -R ${{ github.repository }} --ref main || echo "relais refusé"
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: quentpapa-lang/strategie3
          ssh-key: ${{ secrets.CLE_STRATEGIE3 }}
          path: strategie3
      - uses: actions/checkout@v4
        with:
          repository: quentpapa-lang/bot-agents
          ssh-key: ${{ secrets.CLE_BOT_AGENTS }}
          path: bot-agents
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r strategie3/requirements.txt
      - name: identité git
        run: |
          for d in strategie3 bot-agents; do
            git -C $d config user.name "bots-continu"
            git -C $d config user.email "bots-continu@users.noreply.github.com"
          done
      - name: boucle (minute par minute)
        env:
          # Agents 24/24 : sans GEMINI_API_KEY dans ce dépôt, la veille ne se lance pas (le secours de bot-agents prend le relais).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECOURS_API_KEY: ${{ secrets.SECOURS_API_KEY }}
          SECOURS_BASE_URL: ${{ secrets.SECOURS_BASE_URL }}
          SECOURS_MODELE: ${{ secrets.SECOURS_MODELE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python continu.py
